<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Cartera | Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,500,0,0"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              primary: "#102a47",
              accent: "#e51148",
              surface: "#f6f7f8",
              darkbg: "#13191f"
            }
          }
        }
      };
    </script>
    <link rel="stylesheet" href="styles.css" />
    <style>
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 1rem;
        background:
          radial-gradient(circle at 18% 18%, rgba(229, 17, 72, 0.3), transparent 26%),
          radial-gradient(circle at 82% 12%, rgba(16, 42, 71, 0.38), transparent 28%),
          linear-gradient(135deg, #08111d 0%, #102a47 42%, #1a4a74 100%);
      }

      .login-stage {
        width: min(440px, 100%);
      }

      .login-card {
        border-radius: 1.35rem;
        padding: 1.05rem;
        background: rgba(10, 18, 31, 0.52);
        border: 1px solid rgba(255, 255, 255, 0.14);
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.28);
        color: #fff;
        position: relative;
        overflow: hidden;
        transform-style: preserve-3d;
        transform: perspective(900px) rotateX(var(--tilt-x, 0deg)) rotateY(var(--tilt-y, 0deg));
        transition: transform 220ms ease, filter 220ms ease;
        backdrop-filter: blur(18px);
      }

      .login-card::before {
        content: "";
        position: absolute;
        inset: -2px;
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.18), rgba(229, 17, 72, 0.38), rgba(16, 42, 71, 0.34), rgba(255, 255, 255, 0.14));
        filter: blur(20px);
        opacity: 0.55;
        animation: loginSpin 10s linear infinite;
      }

      .login-card::after {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: 1.32rem;
        background:
          radial-gradient(circle at var(--glow-x, 50%) var(--glow-y, 0%), rgba(229, 17, 72, 0.22), transparent 55%),
          rgba(7, 16, 27, 0.22);
        pointer-events: none;
      }

      .login-card > * {
        position: relative;
        z-index: 1;
      }

      .login-brand {
        margin: 0 0 0.95rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.65rem;
        font-size: 1.3rem;
        font-weight: 900;
        letter-spacing: -0.04em;
        line-height: 1;
        color: #fff;
        text-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
      }

      .login-brand-mark {
        width: 2.35rem;
        height: 2.35rem;
        display: grid;
        place-items: center;
        border-radius: 0.85rem;
        background: linear-gradient(135deg, rgba(229, 17, 72, 0.95), rgba(255, 73, 119, 0.95));
        box-shadow: 0 12px 26px rgba(229, 17, 72, 0.26);
      }

      .login-form {
        display: grid;
        gap: 0.7rem;
      }

      .login-field {
        display: grid;
        grid-template-columns: 2rem 1fr auto;
        align-items: center;
        gap: 0.55rem;
        padding: 0.8rem 0.8rem;
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.14);
        transition: transform 160ms ease, background 160ms ease;
      }

      .login-field:focus-within {
        transform: translateY(-1px);
        background: rgba(255, 255, 255, 0.1);
      }

      .login-input {
        border: 0;
        outline: none;
        background: transparent;
        color: #fff;
        font-family: inherit;
        font-weight: 600;
        font-size: 0.95rem;
      }

      .login-input::placeholder {
        color: rgba(255, 255, 255, 0.75);
        font-weight: 600;
      }

      .login-peek {
        border: 0;
        height: 2.2rem;
        width: 2.2rem;
        border-radius: 0.95rem;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.9);
        cursor: pointer;
        transition: transform 140ms ease;
      }

      .login-peek:hover {
        transform: translateY(-1px);
      }

      .login-submit {
        border: 0;
        height: 2.75rem;
        border-radius: 1.05rem;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        font-family: inherit;
        font-weight: 800;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(120deg, rgba(203, 10, 64, 0.98) 0%, rgba(229, 17, 72, 0.98) 55%, rgba(255, 64, 116, 0.98) 100%);
        box-shadow: 0 14px 30px rgba(229, 17, 72, 0.24);
        transition: transform 160ms ease;
        margin-top: 0.15rem;
      }

      .login-submit:hover {
        transform: translateY(-1px);
      }

      .login-status {
        margin-top: 0.2rem;
        padding: 0.65rem 0.75rem;
        border-radius: 1rem;
        font-size: 0.9rem;
        line-height: 1.25;
        border: 1px solid rgba(255, 255, 255, 0.16);
        background: rgba(255, 255, 255, 0.08);
      }

      .login-status[data-mode="error"] {
        background: rgba(229, 17, 72, 0.16);
        border-color: rgba(255, 73, 119, 0.46);
      }

      .login-status[data-mode="warn"] {
        background: rgba(16, 42, 71, 0.22);
      }

      @keyframes loginSpin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @media (max-width: 960px) {
        body {
          padding: 0.75rem;
        }

        .login-stage {
          width: min(100%, 440px);
        }
      }
    </style>
  </head>
  <body class="bg-surface text-slate-800">
    <div class="login-stage">
      <section class="login-card sc-auth-card" aria-label="Acceso">
        <h1 class="login-brand">
          <span class="login-brand-mark" aria-hidden="true">
            <span class="material-symbols-outlined">account_balance</span>
          </span>
          Sistema Cartera
        </h1>
        <form class="login-form" id="login-form">
          <div class="login-field sc-auth-field" title="Usuario">
            <span class="material-symbols-outlined" aria-hidden="true">person</span>
            <input class="login-input sc-auth-input" id="login-user" type="text" placeholder="Usuario" autocomplete="username" aria-label="Usuario" />
            <span></span>
          </div>
          <div class="login-field sc-auth-field">
            <span class="material-symbols-outlined" aria-hidden="true">key</span>
            <input class="login-input sc-auth-input" id="login-pass" type="password" placeholder="Contraseña" autocomplete="current-password" aria-label="Contraseña" />
            <button class="login-peek sc-auth-peek" id="login-peek" type="button" aria-label="Mostrar/ocultar contraseña">
              <span class="material-symbols-outlined">visibility</span>
            </button>
          </div>
          <button class="login-submit sc-auth-submit" id="login-submit" type="submit" aria-label="Entrar al sistema">
            <span class="material-symbols-outlined" aria-hidden="true">login</span>
          </button>

          <div class="login-status sc-auth-status is-hidden" id="login-status" role="status" aria-live="polite"></div>
        </form>
      </section>
    </div>

    <script src="auth-guard.js"></script>
  </body>
</html>
